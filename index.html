<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6f3" />
    <title>SignBridge — studio de gestes</title>
    <meta name="description" content="Un studio accessible pour explorer la reconnaissance de gestes, visualiser les mots détectés et choisir la synthèse vocale." />
    <meta property="og:title" content="SignBridge — studio de gestes" />
    <meta property="og:description" content="Un studio accessible pour explorer la reconnaissance de gestes, visualiser les mots détectés et choisir la synthèse vocale." />
    <script>
      // Gracefully handle browser/platform camera permission rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (event.reason.name === 'NotAllowedError' ||
           event.reason.name === 'NotFoundError' ||
           event.reason.name === 'SecurityError' ||
           String(event.reason).includes('NotAllowedError') ||
           String(event.reason).includes('not allowed by the user agent') ||
           String(event.reason).includes('Failed to acquire camera feed'))
        ) {
          event.preventDefault();
          console.warn("Handled browser camera permission restriction:", event.reason);
        }
      });
    </script>
    <!-- MediaPipe scripts for hand detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
